<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="Who is most likely to">
  <!-- Riso-style mark: cream paper, flat inks, hard black keyline. -->
  <rect width="64" height="64" rx="8" fill="#f7f0dd" />
  <rect x="3.5" y="3.5" width="57" height="57" rx="6" fill="none" stroke="#14110f" stroke-width="4" />
  <!-- Misregistered plates, offset the way a cheap print job slips. -->
  <text
    x="35"
    y="45"
    text-anchor="middle"
    font-family="Arial Black, Arial, sans-serif"
    font-size="36"
    font-weight="900"
    fill="#1f4bff"
  >?</text>
  <text
    x="29"
    y="45"
    text-anchor="middle"
    font-family="Arial Black, Arial, sans-serif"
    font-size="36"
    font-weight="900"
    fill="#ff3d81"
  >?</text>
  <text
    x="32"
    y="45"
    text-anchor="middle"
    font-family="Arial Black, Arial, sans-serif"
    font-size="36"
    font-weight="900"
    fill="#14110f"
  >?</text>
</svg>

